name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        # `astro build` compiles .astro files without type-checking them, so
        # this is the only step that reports type errors, unused imports, and
        # template diagnostics. Hints do not affect the exit code; errors do.
        # See issue #168.
        run: npm run check

      - name: Build site
        # Tee so the log can be inspected for warnings that do not affect
        # the exit code. pipefail is on by default in GitHub's bash shell,
        # so a real build failure still fails this step.
        run: npm run build 2>&1 | tee build.log

      - name: Verify build output
        # The build exiting 0 is not sufficient: Astro reports empty content
        # collections as a warning. See issue #121.
        run: scripts/verify-build-output.sh build.log

      - name: Check npm audit against the accepted baseline
        # Fails only on advisories outside the set accepted in
        # docs/SECURITY-AUDIT.md, so the documented acceptance cannot quietly
        # widen to cover something new.
        run: scripts/check-audit-baseline.sh
        env:
          # For the GitHub Advisory API lookup that reports when an accepted
          # advisory gains a patched release. The endpoint is public, but `gh`
          # needs a token to make the call at all; without it the script falls
          # back to npm's affected-range heuristic.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-log
          path: build.log
          retention-days: 7

  # Netlify builds the deploy preview independently of this workflow, so wait
  # for the commit status it posts, then exercise the site it actually served.
  # This covers what a dist/ inspection structurally cannot: the SSR route,
  # the adapter, and real HTTP routing.
  preview-acceptance:
    runs-on: ubuntu-latest
    # Deploy previews only exist for pull requests.
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      statuses: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Wait for the Netlify deploy preview
        id: preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # The PR head SHA; github.sha is the merge commit, which Netlify
          # does not post a status against.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CONTEXT: netlify/projectinsomnia/deploy-preview
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            payload=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/status" \
              --jq ".statuses[] | select(.context == \"${CONTEXT}\") | \"\(.state) \(.target_url)\"" \
              2>/dev/null | head -1 || true)
            state="${payload%% *}"
            url="${payload#* }"

            case "${state}" in
              success)
                echo "Deploy preview ready: ${url}"
                echo "url=${url}" >> "${GITHUB_OUTPUT}"
                exit 0
                ;;
              failure | error)
                echo "::error::Netlify deploy preview reported '${state}'. See ${url}"
                exit 1
                ;;
              *)
                echo "attempt ${attempt}/40: state='${state:-none}', waiting..."
                ;;
            esac
            sleep 15
          done
          echo "::error::Timed out after ~10m waiting for ${CONTEXT}."
          exit 1

      - name: Run acceptance checks against the preview
        run: scripts/verify-deploy-preview.sh "${PREVIEW_URL}"
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
